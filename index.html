<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoComo - Official Kids Channel</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Fredoka', cursive; }
        body { background-color: #fffaf0; color: #333; text-align: center; }
        
        /* Banner Styling */
        .banner {
            width: 100%;
            height: 250px;
            background-image: url('https://yt3.googleusercontent.com/QcZ958uHszbuq1nn5CcqAAbLygvUAMRrz1L_zdaosxQ0TG-TD-F-e5-fqWbaG3iqCF8tWKLkvw=w1707-fcrop64=1,00005a57ffffa5a8-k-c0xffffffff-no-nd-rj');
            background-size: cover;
            background-position: center;
            border-bottom: 5px solid #ffeb3b;
        }

        .profile-section {
            margin-top: -60px;
            padding: 20px;
        }
        .channel-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 6px solid #fffaf0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            object-fit: cover;
        }

        h1 { font-size: 3rem; margin-top: 10px; }
        .g-color { color: #00bcd4; } .o1-color { color: #ffeb3b; } .c-color { color: #ff5252; } 
        .o2-color { color: #9c27b0; } .m-color { color: #4caf50; } .o3-color { color: #ff9800; }

        .container { max-width: 1000px; margin: 20px auto; padding: 20px; }
        .videos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        
        .video-card { background: white; padding: 10px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        iframe { width: 100%; height: 200px; border-radius: 15px; border: none; }
        
        .social-links { margin: 40px 0; }
        .social-links a { margin: 10px; padding: 15px 25px; border-radius: 30px; color: white; text-decoration: none; display: inline-block; font-weight: 600; }
        .yt { background: #ff0000; } .fb { background: #1877f2; } .insta { background: #e1306c; }
    </style>
</head>
<body>

    <div class="banner"></div>
    <div class="profile-section">
        <img src="https://yt3.googleusercontent.com/_zCWvLGz10cAIMX0aRzYcM9m6cXgRIRmQlBAOIRt1PjhOJwWKWxXGNWFcjJ-qbSEUwq_HZWnUg=s160-c-k-c0x00ffffff-no-rj" class="channel-logo" alt="GoComo">
        <h1>
            <span class="g-color">G</span><span class="o1-color">o</span><span class="c-color">C</span><span class="o2-color">o</span><span class="m-color">m</span><span class="o3-color">o</span>
        </h1>
    </div>

    <div class="container">
        <h2>Our Popular Videos</h2>
        <div class="videos-grid">
            <div class="video-card"><iframe src="https://www.youtube.com/embed/z57FyjYG7Yo"></iframe><p>Meow Meow Poonai</p></div>
            <div class="video-card"><iframe src="https://www.youtube.com/embed/o-SpIG36J-0"></iframe><p>Kuva Vaathu Song</p></div>
            <div class="video-card"><iframe src="https://www.youtube.com/embed/58Yr3DGTY6M"></iframe><p>Ganapathy Song</p></div>
            <div class="video-card"><iframe src="https://www.youtube.com/embed/6aNt3LxpVJc"></iframe><p>Kiya Kiya Kuruvi</p></div>
            <div class="video-card"><iframe src="https://www.youtube.com/embed/yXuhLPgk6bs"></iframe><p>Watermelon Song</p></div>
        </div>

        <div class="social-links">
            <a href="https://www.youtube.com/@GoComo" class="yt"><i class="fab fa-youtube"></i> Subscribe on YouTube</a>
        </div>
    </div>

</body>
</html>
